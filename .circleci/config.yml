version: 2.1

jobs:
  web-check:
    docker:
      # Exact pin: the bare cimg/node:18 tag is not resolvable on Docker Hub
      # ("manifest unknown"), which made the job fail before it even started.
      - image: cimg/node:18.20.8
    steps:
      - checkout
      - run:
          name: Install dependencies (none required — stdlib only)
          command: node --version
      - run:
          name: Syntax-check inline scripts and asset references
          command: node scripts/check-web.mjs

workflows:
  version: 2
  build:
    jobs:
      - web-check
